[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-meshzork-plugin"
version = "0.3.0"
description = "Native openHop service plugin for playing Zork I over MeshCore direct messages"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "MacKayz117" }
]
dependencies = [
  "openhop-core==1.1.1",
  "pexpect>=4.9,<5",
  "yazm-py==0.2.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0"
]

[project.scripts]
meshzork-openhop = "meshzork_plugin.service:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meshzork_plugin*"]

[tool.setuptools.package-data]
meshzork_plugin = ["assets/zork1.z3", "assets/meshzork-openhop.png"]

[tool.setuptools.data-files]
"share/openhop/plugins/openhop.meshzork" = ["openhop-plugin.json", "config.default.json"]
"share/openhop/plugins/openhop.meshzork/ui" = [
  "ui/index.html",
  "ui/app.js",
  "ui/styles.css",
  "ui/meshzork-openhop.png",
  "ui/meshzork-card.png"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
